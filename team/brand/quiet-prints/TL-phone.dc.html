<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Quiet Prints: review timeline on a phone</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&amp;family=Bricolage+Grotesque:opsz,wght@12..96,500..800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.ph{display:flex;flex-direction:column;overflow:hidden}
.ph i{display:block}
.p1 i:nth-child(1){flex:48;background:#9DBFD3}.p1 i:nth-child(2){flex:14;background:#D9C9A3}.p1 i:nth-child(3){flex:38;background:#5E7F6B}
.p2 i:nth-child(1){flex:40;background:#E9D6C4}.p2 i:nth-child(2){flex:30;background:#B98A6E}.p2 i:nth-child(3){flex:30;background:#6E4F45}
.p3 i:nth-child(1){flex:30;background:#F2E3B6}.p3 i:nth-child(2){flex:25;background:#E39B5D}.p3 i:nth-child(3){flex:45;background:#7A4B3A}
.p5 i:nth-child(1){flex:45;background:#D7E3C8}.p5 i:nth-child(2){flex:30;background:#89A96E}.p5 i:nth-child(3){flex:25;background:#4C6640}
.p6 i:nth-child(1){flex:50;background:#2E3550}.p6 i:nth-child(2){flex:6;background:#E3A86A}.p6 i:nth-child(3){flex:44;background:#1D2236}
.p8 i:nth-child(1){flex:35;background:#E8E4DC}.p8 i:nth-child(2){flex:30;background:#A9A196}.p8 i:nth-child(3){flex:35;background:#5D574F}
.tile{position:relative;margin:0;border-radius:10px;overflow:hidden;box-shadow:0 1px 2px rgba(31,36,39,0.12),0 4px 10px rgba(31,36,39,0.08)}
.tile.off{box-shadow:none;outline:2px dashed #8FA19D;outline-offset:-2px}
.tile.off .ph{opacity:0.55}
.tag{position:absolute;left:6px;bottom:6px;margin:0;padding:1px 7px;border-radius:999px;background:#FFFFFF;font-size:12px;font-weight:700;color:#8A4B08}
.chk{position:absolute;top:0;right:0;width:44px;height:44px;display:flex;align-items:center;justify-content:center}
.chk input{position:absolute;opacity:0;width:44px;height:44px;margin:0}
.dot{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#23596B;box-shadow:0 0 0 2px #FFFFFF}
.dot.no{background:#FFFFFF;box-shadow:inset 0 0 0 2px #545B5F,0 0 0 2px #FFFFFF}
.pill{display:inline-flex;align-items:center;flex:none;min-height:44px;padding:0 14px;border-radius:999px;background:#FFFFFF;color:#1F2427;text-decoration:none;font-weight:400;font-size:15px}
.pill.on{background:#23596B;color:#FFFFFF}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #ECF1F0; color: #1F2427; font-family: 'Atkinson Hyperlegible', system-ui, sans-serif; font-size: 16px; line-height: 1.5; display: flex; flex-direction: column; overflow: hidden">
<header style="padding: 16px 20px 0; display: flex; justify-content: space-between; align-items: center">
<span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 19px; font-variation-settings: 'opsz' 36">Keepsake</span>
<span style="font-size: 15px; color: #545B5F">Step 4 of 5 · Review</span>
</header>
<main style="flex: 1; overflow: hidden; padding: 16px 20px 0; display: flex; flex-direction: column; gap: 14px">
<h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 28px; line-height: 1.1; letter-spacing: -0.02em; font-variation-settings: 'opsz' 48">Choose what to save</h1>
<p style="margin: 0; font-size: 15px; color: #545B5F">Everything starts selected. Untick anything you don't want. Nothing is deleted.</p>
<nav aria-label="Jump to a year" style="display: flex; gap: 6px; overflow-x: auto; margin: 0 -20px; padding: 0 20px">
<a href="#" class="pill on" aria-current="true">2024</a><a href="#" class="pill">2023</a><a href="#" class="pill">2022</a><a href="#" class="pill">2021</a><a href="#" class="pill">No date · 312</a>
</nav>
<label style="display: flex; flex-direction: column; gap: 4px; font-size: 15px; color: #545B5F">Jump to month
<select style="min-height: 44px; padding: 0 12px; border-radius: 12px; border: 1px solid #8FA19D; background: #FFFFFF; color: #1F2427; font: inherit; font-size: 16px"><option>June 2024 · 136 of 148</option></select>
</label>
<div style="display: flex; justify-content: space-between; align-items: center; gap: 8px">
<label style="display: flex; align-items: center; gap: 8px; min-height: 44px; font-weight: 700"><input type="checkbox" aria-checked="mixed" style="width: 20px; height: 20px; accent-color: #23596B"> Friday 28 June</label>
<span style="font-size: 15px; color: #545B5F">4 of 6</span>
</div>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
<figure class="tile"><div class="ph p6" style="aspect-ratio: 1"><i></i><i></i><i></i></div><label class="chk"><input type="checkbox" checked aria-label="28 June 2024, 09:12, photo"><span class="dot"><svg width="13" height="13" viewBox="0 0 14 14" fill="none" aria-hidden="true"><path d="M3 7.2l2.6 2.6L11 4.4" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg></span></label><figcaption class="tag">09:12</figcaption></figure>
<figure class="tile"><div class="ph p1" style="aspect-ratio: 1"><i></i><i></i><i></i></div><label class="chk"><input type="checkbox" checked aria-label="28 June 2024, 09:14, photo"><span class="dot"><svg width="13" height="13" viewBox="0 0 14 14" fill="none" aria-hidden="true"><path d="M3 7.2l2.6 2.6L11 4.4" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg></span></label><figcaption class="tag">09:14</figcaption></figure>
<figure class="tile off"><div class="ph p8" style="aspect-ratio: 1"><i></i><i></i><i></i></div><label class="chk"><input type="checkbox" aria-label="28 June 2024, 09:14, photo"><span class="dot no"></span></label><figcaption class="tag">09:14</figcaption></figure>
<figure class="tile"><div class="ph p5" style="aspect-ratio: 1"><i></i><i></i><i></i></div><label class="chk"><input type="checkbox" checked aria-label="28 June 2024, 11:40, video, 0:42"><span class="dot"><svg width="13" height="13" viewBox="0 0 14 14" fill="none" aria-hidden="true"><path d="M3 7.2l2.6 2.6L11 4.4" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg></span></label><figcaption class="tag">0:42 ▶</figcaption></figure>
<figure class="tile off"><div class="ph p2" style="aspect-ratio: 1"><i></i><i></i><i></i></div><label class="chk"><input type="checkbox" aria-label="28 June 2024, 14:31, photo"><span class="dot no"></span></label><figcaption class="tag">14:31</figcaption></figure>
<figure class="tile"><div class="ph p3" style="aspect-ratio: 1"><i></i><i></i><i></i></div><label class="chk"><input type="checkbox" checked aria-label="28 June 2024, 14:32, photo"><span class="dot"><svg width="13" height="13" viewBox="0 0 14 14" fill="none" aria-hidden="true"><path d="M3 7.2l2.6 2.6L11 4.4" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg></span></label><figcaption class="tag">14:32</figcaption></figure>
</div>
</main>
<footer style="background: #FFFFFF; border-top: 1px solid #D9E3E0; padding: 12px 20px 16px; display: flex; flex-direction: column; gap: 8px">
<p role="status" style="margin: 0; font-size: 15px; color: #545B5F; display: flex; justify-content: space-between"><span><b style="color: #1F2427">2,224</b> of 2,236 selected</span><span>Deleted: 0</span></p>
<button type="button" style="width: 100%; min-height: 48px; border-radius: 999px; border: 0; background: #23596B; color: #FFFFFF; font: inherit; font-weight: 700">Save 2,224</button>
</footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
