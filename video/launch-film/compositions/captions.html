<template>
  <style>
    @font-face { font-family: "Atkinson Hyperlegible"; src: url("assets/fonts/atkinson-hyperlegible-latin-700-normal.woff2") format("woff2"); font-weight: 700; }
    #root { position: absolute; inset: 0; }
    .cap { position: absolute; left: 160px; right: 160px; bottom: 74px; overflow: visible; }
    .cap .rule { display: block; width: 56px; height: 5px; border-radius: 3px; background: #23596B; margin-bottom: 18px; }
    .cap .t { font: 700 50px/1.22 "Atkinson Hyperlegible", sans-serif; color: #1F2427; letter-spacing: -0.005em; }
    .cap .w { display: inline-block; white-space: pre; }
  </style>
  <div id="root" data-composition-id="captions" data-width="1920" data-height="1080">
    <div id="captions-c1" class="cap clip" data-start="0.4" data-duration="2.8"><span class="rule"></span><div id="captions-c1-t" class="t"></div></div>
    <div id="captions-c2" class="cap clip" data-start="3.4" data-duration="2.8"><span class="rule"></span><div id="captions-c2-t" class="t"></div></div>
    <div id="captions-c3" class="cap clip" data-start="6.8" data-duration="3.4"><span class="rule"></span><div id="captions-c3-t" class="t"></div></div>
    <div id="captions-c4" class="cap clip" data-start="10.9" data-duration="4.2"><span class="rule"></span><div id="captions-c4-t" class="t"></div></div>
    <div id="captions-c5" class="cap clip" data-start="15.9" data-duration="4.8"><span class="rule"></span><div id="captions-c5-t" class="t"></div></div>
    <div id="captions-c6" class="cap clip" data-start="21.4" data-duration="6.2"><span class="rule"></span><div id="captions-c6-t" class="t"></div></div>
    <div id="captions-c7" class="cap clip" data-start="28.4" data-duration="4.8"><span class="rule"></span><div id="captions-c7-t" class="t"></div></div>
  </div>
  <script>
    const C = window.CAPTIONS[window.CAPTION_LANG] || window.CAPTIONS.en;
    const APP = window.BRAND.appName;
    const tl = gsap.timeline({ paused: true });
    [["c1", 0.4, 2.8], ["c2", 3.4, 2.8], ["c3", 6.8, 3.4], ["c4", 10.9, 4.2], ["c5", 15.9, 4.8], ["c6", 21.4, 6.2], ["c7", 28.4, 4.8]].forEach(([k, s, d]) => {
      const box = document.getElementById("captions-" + k + "-t");
      const words = C[k].replace("{APP}", APP).split(" ");
      words.forEach((w, i) => { if (i) box.appendChild(document.createTextNode(" ")); const sp = document.createElement("span"); sp.className = "w"; sp.textContent = w; box.appendChild(sp); });
      tl.fromTo("#captions-" + k + " .rule", { scaleX: 0, transformOrigin: "0 50%" }, { scaleX: 1, duration: 0.35, ease: "power3.out" }, s);
      tl.fromTo(box.querySelectorAll(".w"), { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.16, ease: "power4.out", stagger: 0.06 }, s + 0.05);
      tl.to("#captions-" + k, { opacity: 0, filter: "blur(6px)", duration: 0.2, ease: "power2.in" }, Math.round((s + d - 0.2) * 100) / 100);
    });
    window.__timelines["captions"] = tl;
  </script>
</template>
